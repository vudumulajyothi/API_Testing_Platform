name: TestPilot CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/TestPilot.sln

    - name: Build Backend Solution
      run: dotnet build backend/TestPilot.sln --no-restore --configuration Release

    - name: Run Backend Unit Tests
      run: dotnet test backend/TestPilot.sln --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Build & Lint (Angular)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/testpilot-ui/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend/testpilot-ui
        npm ci || npm install

    - name: Build Angular Application
      run: |
        cd frontend/testpilot-ui
        npm run build --if-present
